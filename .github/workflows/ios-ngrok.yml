name: iPhone Simulator - ngrok VNC

on:
  workflow_dispatch:

jobs:
  ios-vnc:
    runs-on: macos-26
    timeout-minutes: 360

    steps:

      - name: Check macOS and Xcode
        run: |
          echo "===== macOS ====="
          sw_vers

          echo "===== Xcode ====="
          xcodebuild -version

          echo "===== iOS Runtimes ====="
          xcrun simctl list runtimes available

      - name: Install ngrok
        run: |
          brew install ngrok
          ngrok version

      - name: Find iOS runtime
        shell: bash
        run: |
          RUNTIME=$(
            xcrun simctl list runtimes available |
            grep -E 'iOS [0-9]+\.[0-9]+' |
            head -1 |
            sed -E 's/.*(com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+).*/\1/'
          )

          if [ -z "$RUNTIME" ]; then
            echo "ERROR: No iOS runtime found."
            exit 1
          fi

          echo "RUNTIME=$RUNTIME" >> "$GITHUB_ENV"

          echo "Using iOS runtime:"
          echo "$RUNTIME"

      - name: Find iPhone device type
        shell: bash
        run: |
          DEVICE_TYPE=$(
            xcrun simctl list devicetypes |
            grep "iPhone 17 Pro (" |
            sed -E 's/.*(com\.apple\.CoreSimulator\.SimDeviceType\.[^)]+).*/\1/' |
            head -1
          )

          if [ -z "$DEVICE_TYPE" ]; then
            echo "iPhone 17 Pro not found."

            echo "Available iPhones:"
            xcrun simctl list devicetypes | grep iPhone

            exit 1
          fi

          echo "DEVICE_TYPE=$DEVICE_TYPE" >> "$GITHUB_ENV"

          echo "Using device type:"
          echo "$DEVICE_TYPE"

      - name: Create iPhone Simulator
        shell: bash
        run: |
          DEVICE_ID=$(
            xcrun simctl create \
              "Remote iPhone" \
              "$DEVICE_TYPE" \
              "$RUNTIME"
          )

          if [ -z "$DEVICE_ID" ]; then
            echo "ERROR: Failed to create simulator."
            exit 1
          fi

          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

          echo "================================"
          echo "Created iPhone 17 Pro"
          echo "Device ID:"
          echo "$DEVICE_ID"
          echo "================================"

      - name: Boot iPhone Simulator
        shell: bash
        run: |
          echo "Booting iPhone Simulator..."

          xcrun simctl boot "$DEVICE_ID" || true

          echo "Opening Simulator..."
          open -a Simulator

          echo "Waiting for simulator to finish booting..."

          xcrun simctl bootstatus "$DEVICE_ID" -b

          echo "================================"
          echo "iPhone Simulator is READY"
          echo "================================"

      - name: Configure macOS VNC
        shell: bash
        run: |
          VNC_PASSWORD
