name: iPhone Simulator - ngrok VNC

on:
  workflow_dispatch:

jobs:
  ios-vnc:
    runs-on: macos-26
    timeout-minutes: 360

    steps:

      # =========================================================
      # 1. CHECK SCREEN SHARING
      # =========================================================
      - name: Check Screen Sharing
        shell: bash
        run: |
          echo "======================================"
          echo "SCREEN SHARING DIAGNOSTICS"
          echo "======================================"

          echo ""
          echo "--- macOS ---"
          sw_vers

          echo ""
          echo "--- Current user ---"
          whoami

          echo ""
          echo "--- ARDAgent help ---"
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -help || true

          echo ""
          echo "--- VNC / Screen Sharing processes ---"
          ps aux | grep -iE 'screensharing|ARDAgent|vnc' | grep -v grep || true

          echo ""
          echo "--- Port 5900 ---"
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || true

          echo ""
          echo "--- Launchd screen/remote services ---"
          sudo launchctl list | grep -iE 'screen|remote|vnc' || true


      # =========================================================
      # 2. CHECK XCODE
      # =========================================================
      - name: Check Xcode
        shell: bash
        run: |
          echo "======================================"
          echo "XCODE"
          echo "======================================"

          xcodebuild -version

          echo ""
          echo "--- Available runtimes ---"
          xcrun simctl list runtimes


      # =========================================================
      # 3. INSTALL NGROK
      # =========================================================
      - name: Install ngrok
        shell: bash
        run: |
          echo "======================================"
          echo "INSTALLING NGROK"
          echo "======================================"

          brew install ngrok

          echo ""
          ngrok version


      # =========================================================
      # 4. SET IOS RUNTIME
      # =========================================================
      - name: Set iOS runtime
        shell: bash
        run: |
          RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-26-2"

          echo "Checking:"
          echo "$RUNTIME"

          if ! xcrun simctl list runtimes | grep -q "$RUNTIME"; then
            echo ""
            echo "ERROR: iOS 26.2 runtime not found."
            echo ""
            xcrun simctl list runtimes
            exit 1
          fi

          echo "RUNTIME=$RUNTIME" >> "$GITHUB_ENV"

          echo ""
          echo "iOS runtime found."


      # =========================================================
      # 5. SET IPHONE DEVICE TYPE
      # =========================================================
      - name: Set iPhone device type
        shell: bash
        run: |
          DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro"

          echo "DEVICE_TYPE=$DEVICE_TYPE" >> "$GITHUB_ENV"

          echo ""
          echo "Using device:"
          echo "$DEVICE_TYPE"


      # =========================================================
      # 6. CREATE IPHONE
      # =========================================================
      - name: Create iPhone Simulator
        shell: bash
        run: |
          echo "======================================"
          echo "CREATING IPHONE SIMULATOR"
          echo "======================================"

          DEVICE_ID=$(xcrun simctl create \
            "Remote iPhone" \
            "$DEVICE_TYPE" \
            "$RUNTIME")

          if [ -z "$DEVICE_ID" ]; then
            echo "ERROR: Simulator creation failed."
            exit 1
          fi

          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

          echo ""
          echo "Created simulator:"
          echo "$DEVICE_ID"


      # =========================================================
      # 7. BOOT IPHONE
      # =========================================================
      - name: Boot iPhone Simulator
        shell: bash
        run: |
          echo "======================================"
          echo "BOOTING IPHONE"
          echo "======================================"

          xcrun simctl boot "$DEVICE_ID" || true

          open -a Simulator

          echo ""
          echo "Waiting for simulator..."

          xcrun simctl bootstatus "$DEVICE_ID" -b

          echo ""
          echo "SIMULATOR READY"


      # =========================================================
      # 8. CHECK SIMULATOR
      # =========================================================
      - name: Check Simulator
        shell: bash
        run: |
          echo "======================================"
          echo "SIMULATOR STATUS"
          echo "======================================"

          echo ""
          echo "--- Device ---"
          xcrun simctl list devices | grep "$DEVICE_ID" || true

          echo ""
          echo "--- Remote iPhone ---"
          xcrun simctl list devices | grep -A2 "Remote iPhone" || true


      # =========================================================
      # 9. CONFIGURE VNC
      # =========================================================
      - name: Configure VNC
        shell: bash
        run: |
          echo "======================================"
          echo "CONFIGURING VNC"
          echo "======================================"

          VNC_PASSWORD="iphone123"

          ARD="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          echo ""
          echo "--- Activating Remote Management ---"

          sudo "$ARD" \
            -activate \
            -configure -access -on \
            -configure -allowAccessFor -allUsers \
            -configure -users "$USER" \
            -configure -privs -all \
            -restart -agent \
            -privs -all || true

          echo ""
          echo "--- Configuring VNC password ---"

          sudo "$ARD" \
            -configure \
            -clientopts \
            -setvnclegacy -vnclegacy yes \
            -setvncpw -vncpw "$VNC_PASSWORD" || true

          echo ""
          echo "--- Restarting Remote Management ---"

          sudo launchctl kickstart -k system/com.apple.RemoteManagement || true

          sudo launchctl kickstart -k system/com.apple.screensharing || true

          sleep 5

          echo ""
          echo "VNC PASSWORD: $VNC_PASSWORD"


      # =========================================================
      # 10. CHECK VNC
      # =========================================================
      - name: Check VNC
        shell: bash
        run: |
          echo "======================================"
          echo "CHECKING VNC"
          echo "======================================"

          for i in {1..20}; do
            echo "Attempt $i/20..."

            if nc -z 127.0.0.1 5900; then
              echo ""
              echo "======================================"
              echo "VNC PORT 5900 IS OPEN"
              echo "======================================"

              echo ""
              echo "--- Listening process ---"
              sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || true

              exit 0
            fi

            sleep 2
          done

         
