name: iPhone Simulator - ngrok VNC

on:
  workflow_dispatch:

jobs:
  ios-vnc:
    runs-on: macos-26
    timeout-minutes: 360

    steps:

      - name: Check macOS and Xcode
        run: |
          echo "===== macOS ====="
          sw_vers

          echo "===== Xcode ====="
          xcodebuild -version

      - name: Install ngrok
        run: |
          brew install ngrok
          ngrok version

      - name: Set iOS runtime
        shell: bash
        run: |
          RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-26-2"

          if ! xcrun simctl list runtimes | grep -q "$RUNTIME"; then
            echo "Requested iOS runtime was not found."
            echo ""
            echo "Available runtimes:"
            xcrun simctl list runtimes
            exit 1
          fi

          echo "RUNTIME=$RUNTIME" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$RUNTIME"

      - name: Set iPhone device type
        shell: bash
        run: |
          DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro"

          echo "DEVICE_TYPE=$DEVICE_TYPE" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$DEVICE_TYPE"

      - name: Create iPhone Simulator
        shell: bash
        run: |
          echo "Creating iPhone 17 Pro..."

          DEVICE_ID=$(
            xcrun simctl create \
              "Remote iPhone" \
              "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro" \
              "$RUNTIME"
          )

          if [ -z "$DEVICE_ID" ]; then
            echo "ERROR: Simulator creation failed."
            exit 1
          fi

          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

          echo ""
          echo "======================================"
          echo "iPhone Simulator Created"
          echo "======================================"
          echo "Device ID: $DEVICE_ID"

      - name: Boot iPhone Simulator
        shell: bash
        run: |
          echo "Booting iPhone Simulator..."

          xcrun simctl boot "$DEVICE_ID" || true

          echo "Opening Simulator..."
          open -a Simulator

          echo "Waiting for simulator..."

          xcrun simctl bootstatus "$DEVICE_ID" -b

          echo ""
          echo "======================================"
          echo "SIMULATOR READY"
          echo "======================================"

      - name: Check Screen Sharing
        shell: bash
        run: |
          echo "======================================"
          echo "SCREEN SHARING STATUS"
          echo "======================================"

          echo ""
          echo "--- Screen Sharing service ---"

          sudo launchctl print system/com.apple.screensharing || true

          echo ""
          echo "--- Remote Management status ---"

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -status || true

          echo ""
          echo "--- Current user ---"

          whoami

          echo ""
          echo "--- Port 5900 before configuration ---"

          sudo lsof -iTCP:5900 -sTCP:LISTEN || true

      - name: Configure macOS VNC
        shell: bash
        run: |
          VNC_PASSWORD="iphone123"

          echo "Enabling Remote Management..."

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate \
            -configure -access -on \
            -configure -allowAccessFor -allUsers \
            -configure -users "$USER" \
            -configure -privs -all \
            -restart -agent \
            -privs -all

          echo ""
          echo "Setting VNC password..."

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure \
            -clientopts \
            -setvnclegacy -vnclegacy yes \
            -setvncpw -vncpw "$VNC_PASSWORD"

          echo ""
          echo "Restarting Screen Sharing..."

          sudo launchctl kickstart -k system/com.apple.screensharing || true

          sleep 5

          echo ""
          echo "======================================"
          echo "VNC PASSWORD"
          echo "======================================"
          echo "$VNC_PASSWORD"

      - name: Check VNC
        shell: bash
        run: |
          echo "Checking port 5900..."

          for i in {1..15}; do

            if nc -z 127.0.0.1 5900; then
              echo ""
              echo "======================================"
              echo "VNC PORT 5900 IS OPEN"
              echo "======================================"
              exit 0
            fi

            echo "Waiting for VNC..."
            sleep 2

          done

          echo ""
          echo "ERROR: VNC port 5900 is not open."

          echo ""
          echo "Listening ports:"
          sudo lsof -iTCP -sTCP:LISTEN || true

          exit 1

      - name: Configure ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        shell: bash
        run: |
          if [ -z "$NGROK_AUTHTOKEN" ]; then
            echo "ERROR: NGROK_AUTHTOKEN secret is missing."
            echo ""
            echo "Add it in:"
            echo "Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          ngrok config add-authtoken "$NGROK_AUTHTOKEN"

          echo "ngrok configured successfully."

      - name: Start ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "       iPHONE SIMULATOR REMOTE ACCESS"
          echo "=============================================="
          echo ""
          echo "VNC PASSWORD:"
          echo "iphone123"
          echo ""
          echo "Starting ngrok TCP tunnel..."
          echo ""
          echo "=============================================="
          echo ""

          ngrok tcp 5900
